name: Destroy cluster

on:
  workflow_dispatch:
    inputs:
      request:
        description: Request file, for example requests/prod/payments-prod.yaml
        required: true
        type: string
      confirmation:
        description: Type DESTROY followed by the cluster name, for example DESTROY payments-prod
        required: true
        type: string
      delete_managed_project:
        description: Allow Terraform to delete a project that the factory originally created
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: gke-cluster-factory-writes
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: cluster-destruction
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Validate destructive request
        env:
          REQUEST_FILE: ${{ inputs.request }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test -f "$REQUEST_FILE"
          ./scripts/validate_request.py "$REQUEST_FILE"
          cluster=$(python -c 'import sys,yaml; print(yaml.safe_load(open(sys.argv[1]))["metadata"]["name"])' "$REQUEST_FILE")
          [[ "$CONFIRMATION" == "DESTROY ${cluster}" ]] || {
            echo "Confirmation must exactly equal: DESTROY ${cluster}" >&2
            exit 1
          }

      - name: Disable protection and destroy
        env:
          REQUEST_FILE: ${{ inputs.request }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          CREATE_CLUSTER_PROJECTS: ${{ vars.CREATE_CLUSTER_PROJECTS }}
          CLUSTER_PROJECT_PARENT: ${{ vars.CLUSTER_PROJECT_PARENT }}
          BILLING_ACCOUNT: ${{ vars.BILLING_ACCOUNT }}
          GKE_SECURITY_GROUP: ${{ vars.GKE_SECURITY_GROUP }}
          PLATFORM_ADMIN_GROUP: ${{ vars.PLATFORM_ADMIN_GROUP }}
          DELETE_MANAGED_PROJECT: ${{ inputs.delete_managed_project }}
        run: |
          set -euo pipefail
          cluster=$(python -c 'import sys,yaml; print(yaml.safe_load(open(sys.argv[1]))["metadata"]["name"])' "$REQUEST_FILE")
          tfvars=$(mktemp --suffix=.json)
          destroy_complete=false
          cleanup() {
            rm -f "$tfvars"
            if [[ "$destroy_complete" != "true" ]]; then
              ./scripts/set_request_status.py "$REQUEST_FILE" FAILED \
                --condition Destroy --status False \
                --message "Destroy failed. Review the GitHub Actions run and cloud operation logs." || true
            fi
          }
          trap cleanup EXIT
          ./scripts/render_tfvars.py "$REQUEST_FILE" --output "$tfvars"

          terraform -chdir=terraform/cluster init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=gke-clusters/${cluster}"

          extra_args=()
          if [[ "${CREATE_CLUSTER_PROJECTS:-false}" == "true" ]]; then
            if [[ "$DELETE_MANAGED_PROJECT" != "true" ]]; then
              echo "This state manages the cluster project. Select delete_managed_project to acknowledge project deletion." >&2
              exit 1
            fi
            extra_args+=("-var=create_project=true")
            extra_args+=("-var=project_parent=${CLUSTER_PROJECT_PARENT}")
            extra_args+=("-var=billing_account=${BILLING_ACCOUNT}")
          fi

          ./scripts/validate_request_set.py
          ./scripts/set_request_status.py "$REQUEST_FILE" DELETING \
            --condition Destroy --status Unknown --message "Approved destroy started"

          terraform -chdir=terraform/cluster apply \
            -input=false -auto-approve -lock-timeout=10m \
            -var-file="$tfvars" -var=deletion_protection=false "${extra_args[@]}"

          terraform -chdir=terraform/cluster destroy \
            -input=false -auto-approve -lock-timeout=10m \
            -var-file="$tfvars" -var=deletion_protection=false "${extra_args[@]}"

          ./scripts/set_request_status.py "$REQUEST_FILE" DESTROYED \
            --condition Destroy --status True --message "Terraform destroy completed"
          destroy_complete=true

      - name: Commit audit status
        if: always()
        env:
          REQUEST_FILE: ${{ inputs.request }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "$REQUEST_FILE"; then
            exit 0
          fi
          git config user.name "gke-cluster-factory[bot]"
          git config user.email "gke-cluster-factory@users.noreply.github.com"

          git diff -- "$REQUEST_FILE" > /tmp/status.patch

          attempt=0
          until git fetch origin main \
             && git reset --hard origin/main \
             && git apply --3way /tmp/status.patch \
             && git add "$REQUEST_FILE" \
             && git commit -m "chore: record cluster destruction [skip ci]" \
             && git push origin HEAD:main
          do
            attempt=$((attempt + 1))
            if [[ $attempt -ge 5 ]]; then
              echo "::error::Could not publish destruction status after $attempt attempts" >&2
              exit 1
            fi
            echo "Push race detected, retrying (attempt $attempt)..." >&2
            sleep $((attempt * 5))
          done