name: Publish gke.tf to nonprod

# Runs after request-apply.yml commits generated clusters/<project>_<cluster>/gke.tf
# files to main. For every cluster folder that changed, it opens a pull request
# against the `nonprod` branch of the downstream GitOps repository with a copy
# of that folder.

on:
  push:
    branches: [main]
    paths:
      - "clusters/**/gke.tf"
  workflow_dispatch:
    inputs:
      folder:
        description: Optional single folder to (re)publish, e.g. clusters/my-project_my-cluster
        required: false
        type: string

permissions:
  contents: read

env:
  TARGET_REPO: ${{ vars.GKE_TF_TARGET_REPO || 'Health-Abhi/h100-gke-automation' }}
  TARGET_BRANCH: ${{ vars.GKE_TF_TARGET_BRANCH || 'nonprod' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine changed cluster folders
        id: changed
        run: |
          set -euo pipefail

          manual_folder="${{ github.event.inputs.folder || '' }}"
          if [[ -n "$manual_folder" ]]; then
            FOLDERS=("$manual_folder")
          else
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
              mapfile -t FOLDERS < <(find clusters -mindepth 1 -maxdepth 1 -type d -print | sort)
            else
              mapfile -t FOLDERS < <(
                git diff --name-only "$before" "${{ github.sha }}" -- 'clusters/**/gke.tf' |
                  sed -E 's#^(clusters/[^/]+)/.*#\1#' | sort -u
              )
            fi
          fi

          if [[ ${#FOLDERS[@]} -eq 0 ]]; then
            echo "No cluster folders changed."
            {
              echo "folders<<EOF_FOLDERS"
              echo "EOF_FOLDERS"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Changed folder: %s\n' "${FOLDERS[@]}"
          {
            echo "folders<<EOF_FOLDERS"
            printf '%s\n' "${FOLDERS[@]}"
            echo "EOF_FOLDERS"
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request(s) against ${{ env.TARGET_BRANCH }}
        if: steps.changed.outputs.folders != ''
        env:
          GH_TOKEN: ${{ secrets.GKE_TF_PUBLISH_TOKEN }}
          FOLDERS: ${{ steps.changed.outputs.folders }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Set the GKE_TF_PUBLISH_TOKEN repo secret to a token with write access to ${TARGET_REPO} (contents + pull-requests)."
            exit 1
          fi

          workdir=$(mktemp -d)
          git clone --branch "$TARGET_BRANCH" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" "$workdir/target"

          git config --global user.name "gke-cluster-factory[bot]"
          git config --global user.email "gke-cluster-factory@users.noreply.github.com"

          short_sha="${GITHUB_SHA:0:12}"

          while IFS= read -r folder; do
            [[ -z "$folder" ]] && continue
            if [[ ! -d "$folder" ]]; then
              echo "::warning::$folder no longer exists, skipping."
              continue
            fi

            name=$(basename "$folder")
            branch="gke-tf/${name}-${short_sha}"

            (cd "$workdir/target" && git checkout -B "$branch" "origin/${TARGET_BRANCH}")

            mkdir -p "$workdir/target/$folder"
            rsync -a --delete "$folder"/ "$workdir/target/$folder"/

            pushd "$workdir/target" >/dev/null
            git add "$folder"
            if git diff --cached --quiet; then
              echo "No effective changes for $folder, skipping PR."
              popd >/dev/null
              continue
            fi
            git commit -m "chore: publish ${name} gke.tf (source ${short_sha})"
            git push origin "$branch"
            gh pr create \
              --repo "$TARGET_REPO" \
              --base "$TARGET_BRANCH" \
              --head "$branch" \
              --title "Publish ${name} gke.tf" \
              --body "Automated update of \`${folder}/gke.tf\`, generated by gke-cluster-factory at commit ${GITHUB_SHA}." \
              || echo "::warning::Could not open PR for $folder (it may already be open)."
            popd >/dev/null
          done <<< "$FOLDERS"
