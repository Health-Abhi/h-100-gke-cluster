name: Publish gke.tf to cluster-list

# Flow:
#   1. A user fills out the portal, which commits a new/updated
#      clusters/<project>_<cluster>/gke.tf straight onto `main` here.
#   2. That push triggers this workflow, which copies every cluster folder
#      that changed/was added directly onto the `cluster-list` branch of
#      the downstream repo (h100-gke-automation).
#
# No branch is created and no PR is opened - this pushes straight onto
# `cluster-list`.

on:
  push:
    branches: [main]
    paths:
      - "clusters/**/gke.tf"
  workflow_dispatch:
    inputs:
      folder:
        description: Optional single folder to (re)publish, e.g. clusters/my-project_my-cluster
        required: false
        type: string

permissions:
  contents: read

env:
  TARGET_REPO: ${{ vars.GKE_TF_TARGET_REPO || 'Health-Abhi/h100-gke-automation' }}
  TARGET_WORK_BRANCH: ${{ vars.GKE_TF_WORK_BRANCH || 'cluster-list' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine changed/added cluster folders
        id: changed
        run: |
          set -euo pipefail

          manual_folder="${{ github.event.inputs.folder || '' }}"
          if [[ -n "$manual_folder" ]]; then
            FOLDERS=("$manual_folder")
          else
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
              # First push seen (or no prior sha) -> publish every existing folder.
              mapfile -t FOLDERS < <(find clusters -mindepth 1 -maxdepth 1 -type d -print | sort)
            else
              # Covers both a modified gke.tf in an existing folder AND a
              # brand-new folder the portal just added (shows up as "added").
              mapfile -t FOLDERS < <(
                git diff --name-only --diff-filter=ACMR "$before" "${{ github.sha }}" -- 'clusters/**/gke.tf' |
                  sed -E 's#^(clusters/[^/]+)/.*#\1#' | sort -u
              )
            fi
          fi

          if [[ ${#FOLDERS[@]} -eq 0 ]]; then
            echo "No cluster folders changed."
            {
              echo "folders<<EOF_FOLDERS"
              echo "EOF_FOLDERS"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Changed folder: %s\n' "${FOLDERS[@]}"
          {
            echo "folders<<EOF_FOLDERS"
            printf '%s\n' "${FOLDERS[@]}"
            echo "EOF_FOLDERS"
          } >> "$GITHUB_OUTPUT"

      - name: Push directly to ${{ env.TARGET_WORK_BRANCH }}
        if: steps.changed.outputs.folders != ''
        env:
          GH_TOKEN: ${{ secrets.GKE_TF_PUBLISH_TOKEN }}
          FOLDERS: ${{ steps.changed.outputs.folders }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Set the GKE_TF_PUBLISH_TOKEN repo secret to a token with write access to ${TARGET_REPO} (contents)."
            exit 1
          fi

          workdir=$(mktemp -d)
          git clone --branch "$TARGET_WORK_BRANCH" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" "$workdir/target"
          cd "$workdir/target"

          git config user.name "gke-cluster-factory[bot]"
          git config user.email "gke-cluster-factory@users.noreply.github.com"

          cd - >/dev/null

          names=()
          while IFS= read -r folder; do
            [[ -z "$folder" ]] && continue
            if [[ ! -d "$folder" ]]; then
              echo "::warning::$folder no longer exists, skipping."
              continue
            fi

            name=$(basename "$folder")
            names+=("$name")

            mkdir -p "$workdir/target/$name"
            rsync -a --delete "$folder"/ "$workdir/target/$name"/

            (cd "$workdir/target" && git add "$name")
          done <<< "$FOLDERS"

          cd "$workdir/target"

          if git diff --cached --quiet; then
            echo "No effective changes for any folder, nothing to push."
            exit 0
          fi

          short_sha="${GITHUB_SHA:0:12}"
          git commit -m "chore: publish gke.tf for ${#names[@]} cluster folder(s) (source ${short_sha})"

          attempt=0
          until git push origin "HEAD:${TARGET_WORK_BRANCH}"
          do
            attempt=$((attempt + 1))
            if [[ $attempt -ge 5 ]]; then
              echo "::error::Could not push to ${TARGET_WORK_BRANCH} after $attempt attempts (someone else is pushing to it too)." >&2
              exit 1
            fi
            echo "Push race detected, retrying (attempt $attempt)..." >&2
            sleep $((attempt * 5))
            git pull --rebase origin "$TARGET_WORK_BRANCH"
          done

          printf 'Pushed folder(s) directly to %s: %s\n' "$TARGET_WORK_BRANCH" "${names[*]}"
