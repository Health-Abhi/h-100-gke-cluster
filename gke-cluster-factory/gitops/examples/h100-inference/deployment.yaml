apiVersion: apps/v1
kind: Deployment
metadata:
  name: h100-inference
  namespace: team-payments-ml
  labels:
    app.kubernetes.io/name: h100-inference
    platform.example.com/owner: payments-ml
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: h100-inference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: h100-inference
        platform.example.com/owner: payments-ml
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: h100-inference
      nodeSelector:
        accelerator: nvidia-h100-80gb
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: present
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: us-west1-docker.pkg.dev/PROJECT/REPOSITORY/IMAGE@sha256:REPLACE
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "8"
            limits:
              cpu: "16"
              memory: 128Gi
              nvidia.com/gpu: "8"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: h100-inference
  namespace: team-payments-ml
spec:
  selector:
    app.kubernetes.io/name: h100-inference
  ports:
    - port: 80
      targetPort: 8080
