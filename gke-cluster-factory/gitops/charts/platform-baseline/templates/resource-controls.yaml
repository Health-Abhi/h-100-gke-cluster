apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-budget
  namespace: {{ include "baseline.teamName" . }}
spec:
  hard:
    requests.cpu: {{ .Values.namespace.cpuRequests | quote }}
    limits.cpu: {{ .Values.namespace.cpuLimits | quote }}
    requests.memory: {{ .Values.namespace.memoryRequests | quote }}
    limits.memory: {{ .Values.namespace.memoryLimits | quote }}
    pods: {{ .Values.namespace.pods | quote }}
    services.loadbalancers: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workload-defaults
  namespace: {{ include "baseline.teamName" . }}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: "1"
        memory: 1Gi
      max:
        cpu: "16"
        memory: 64Gi
