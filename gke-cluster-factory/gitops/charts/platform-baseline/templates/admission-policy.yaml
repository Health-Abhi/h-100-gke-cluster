apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: factory-secure-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        platform.example.com/policy: strict
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        !has(object.spec.hostNetwork) || object.spec.hostNetwork == false
      message: hostNetwork is not permitted
    - expression: >-
        !has(object.spec.hostPID) || object.spec.hostPID == false
      message: hostPID is not permitted
    - expression: >-
        !has(object.spec.hostIPC) || object.spec.hostIPC == false
      message: hostIPC is not permitted
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))
      message: hostPath volumes are not permitted
    - expression: >-
        has(object.spec.securityContext) &&
        has(object.spec.securityContext.seccompProfile) &&
        object.spec.securityContext.seccompProfile.type == 'RuntimeDefault'
      message: Pod securityContext.seccompProfile.type must be RuntimeDefault
    - expression: >-
        object.spec.containers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot == true &&
          has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false &&
          (!has(c.securityContext.privileged) || c.securityContext.privileged == false))
      message: containers must run as non-root with privilege escalation disabled
    - expression: >-
        object.spec.containers.all(c,
          has(c.securityContext.capabilities) &&
          has(c.securityContext.capabilities.drop) &&
          c.securityContext.capabilities.drop.exists(cap, cap == 'ALL'))
      message: containers must drop all Linux capabilities
    - expression: >-
        object.spec.containers.all(c,
          has(c.resources) && has(c.resources.requests) && has(c.resources.limits))
      message: every container must define resource requests and limits
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: factory-secure-pods
spec:
  policyName: factory-secure-pods
  validationActions: [Deny, Audit]
