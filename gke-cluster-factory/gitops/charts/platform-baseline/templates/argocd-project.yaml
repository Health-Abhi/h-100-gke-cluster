apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: application-teams
  namespace: argocd
spec:
  description: Guardrails for application team GitOps workloads
  sourceRepos:
    - {{ .Values.gitops.repoURL | quote }}
  destinations:
    - namespace: 'team-*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
