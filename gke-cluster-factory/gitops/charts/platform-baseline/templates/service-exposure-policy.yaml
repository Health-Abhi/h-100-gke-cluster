{{- if ne .Values.workloadExposure "external" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: factory-service-exposure
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        platform.example.com/policy: strict
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  validations:
{{- if eq .Values.workloadExposure "none" }}
    - expression: '!has(object.spec.type) || object.spec.type != "LoadBalancer"'
      message: LoadBalancer Services are not permitted for this cluster request
{{- else }}
    - expression: >-
        !has(object.spec.type) || object.spec.type != 'LoadBalancer' ||
        (has(object.metadata.annotations) &&
          (('networking.gke.io/load-balancer-type' in object.metadata.annotations &&
             object.metadata.annotations['networking.gke.io/load-balancer-type'] == 'Internal') ||
           ('cloud.google.com/load-balancer-type' in object.metadata.annotations &&
             object.metadata.annotations['cloud.google.com/load-balancer-type'] == 'Internal')))
      message: LoadBalancer Services must be internal for this cluster request
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: factory-service-exposure
spec:
  policyName: factory-service-exposure
  validationActions: [Deny, Audit]
{{- end }}
