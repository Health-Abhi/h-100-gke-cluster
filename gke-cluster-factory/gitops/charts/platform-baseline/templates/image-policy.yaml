apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: factory-approved-images
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        platform.example.com/policy: strict
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.spec.containers.all(c, c.image.contains('@sha256:')) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, c.image.contains('@sha256:')))
      message: workload images must be pinned by sha256 digest
    - expression: >-
        object.spec.containers.all(c,
          [{{ range $index, $registry := .Values.policy.allowedRegistries }}{{ if $index }}, {{ end }}{{ $registry | quote }}{{ end }}]
            .exists(prefix, c.image.startsWith(prefix))) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c,
          [{{ range $index, $registry := .Values.policy.allowedRegistries }}{{ if $index }}, {{ end }}{{ $registry | quote }}{{ end }}]
            .exists(prefix, c.image.startsWith(prefix))))
      message: workload images must come from an approved registry
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: factory-approved-images
spec:
  policyName: factory-approved-images
  validationActions: [Deny, Audit]
