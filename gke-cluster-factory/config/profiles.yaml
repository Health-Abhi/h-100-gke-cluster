version: 1
platform_name: GKE Cluster Factory
allowed_regions:
  - us-west1
default_region: us-west1
default_release_channel: REGULAR
gke_security_group: gke-security-groups@example.com
platform_admin_group: gke-platform-admins@example.com
node_locations:
  us-west1:
    - us-west1-a
    - us-west1-b
    - us-west1-c
profiles:
  standard-dev-v1:
    display_name: Standard Development
    description: Regional private GKE Standard cluster for development and test workloads.
    allowed_environments: [dev, test, stage]
    requires_gpu: false
    system_machine_type: e2-standard-4
    general_machine_type: n2-standard-4
    default_capacity:
      system_min_nodes: 3
      system_max_nodes: 6
      general_min_nodes: 0
      general_max_nodes: 12
      max_pods_per_node: 64
    default_backup:
      tier: bronze
      retention_days: 7
      target_rpo_minutes: 1440
    gpu:
      allowed: false
      models: []
      machine_types: []
  standard-prod-v1:
    display_name: Standard Production
    description: Regional highly available private GKE cluster with production guardrails.
    allowed_environments: [prod]
    requires_gpu: false
    system_machine_type: e2-standard-4
    general_machine_type: n2-standard-8
    default_capacity:
      system_min_nodes: 3
      system_max_nodes: 9
      general_min_nodes: 3
      general_max_nodes: 60
      max_pods_per_node: 64
    default_backup:
      tier: gold
      retention_days: 90
      target_rpo_minutes: 60
    gpu:
      allowed: false
      models: []
      machine_types: []
  standard-prod-h100-v1:
    display_name: Production with NVIDIA H100
    description: Production GKE Standard cluster with an isolated reservation-backed H100 pool.
    allowed_environments: [prod]
    requires_gpu: true
    system_machine_type: e2-standard-4
    general_machine_type: n2-standard-8
    default_capacity:
      system_min_nodes: 3
      system_max_nodes: 9
      general_min_nodes: 3
      general_max_nodes: 60
      max_pods_per_node: 64
    default_backup:
      tier: gold
      retention_days: 90
      target_rpo_minutes: 60
    gpu:
      allowed: true
      models:
        - nvidia-h100-80gb
      machine_types:
        - a3-highgpu-8g
      default_machine_type: a3-highgpu-8g
      default_accelerator_count: 8
      recommended_provisioning_model: reservation
