substitutions:
  _REQUEST_FILE: requests/prod/payments-ml-prod-usw1.yaml
  _TF_STATE_BUCKET: replace-with-state-bucket
  _GITOPS_REPO_URL: https://github.com/your-org/gke-cluster-factory.git
  _GITOPS_REVISION: main
  _PLATFORM_ADMIN_GROUP: gke-platform-admins@example.com
  _GKE_SECURITY_GROUP: gke-security-groups@example.com

steps:
  - name: python:3.13-slim
    id: validate-and-render
    entrypoint: bash
    args:
      - -ceu
      - |
        pip install --no-cache-dir -r requirements.txt
        ./scripts/validate_request_set.py
        ./scripts/validate_request.py "${_REQUEST_FILE}"
        GKE_SECURITY_GROUP="${_GKE_SECURITY_GROUP}" PLATFORM_ADMIN_GROUP="${_PLATFORM_ADMIN_GROUP}" \
          ./scripts/render_tfvars.py "${_REQUEST_FILE}" --output /workspace/request.tfvars.json
        python -c 'import yaml; r=yaml.safe_load(open("${_REQUEST_FILE}")); print(r["metadata"]["name"])' > /workspace/cluster-name
        python -c 'import yaml; r=yaml.safe_load(open("${_REQUEST_FILE}")); print(r["spec"]["project_id"])' > /workspace/project-id
        python -c 'import yaml; r=yaml.safe_load(open("${_REQUEST_FILE}")); print(r["spec"]["region"])' > /workspace/region

  - name: hashicorp/terraform:1.15.8
    id: terraform-apply
    entrypoint: sh
    args:
      - -ceu
      - |
        cluster=$(cat /workspace/cluster-name)
        terraform -chdir=terraform/cluster init -reconfigure \
          -backend-config="bucket=${_TF_STATE_BUCKET}" \
          -backend-config="prefix=gke-clusters/${cluster}"
        terraform -chdir=terraform/cluster apply \
          -input=false \
          -auto-approve \
          -var-file=/workspace/request.tfvars.json
        terraform -chdir=terraform/cluster output -raw fleet_membership > /workspace/fleet-membership

  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    id: gitops-bootstrap
    entrypoint: bash
    env:
      - GITOPS_REPO_URL=${_GITOPS_REPO_URL}
      - GITOPS_REVISION=${_GITOPS_REVISION}
      - REQUEST_FILE=${_REQUEST_FILE}
      - PLATFORM_ADMIN_GROUP=${_PLATFORM_ADMIN_GROUP}
    args:
      - -ceu
      - |
        apt-get update && apt-get install -y --no-install-recommends kubectl python3 python3-yaml && rm -rf /var/lib/apt/lists/*
        membership=$(cat /workspace/fleet-membership)
        project=$(cat /workspace/project-id)
        region=$(cat /workspace/region)
        gcloud container fleet memberships get-credentials "$membership" --project "$project" --location "$region"
        ./scripts/bootstrap_cluster.sh
        kubectl wait --for=condition=Ready nodes --all --timeout=15m
        kubectl -n argocd wait --for=jsonpath='{.status.sync.status}'=Synced application/platform-baseline --timeout=15m
        kubectl -n argocd wait --for=jsonpath='{.status.health.status}'=Healthy application/platform-baseline --timeout=15m

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 7200s
