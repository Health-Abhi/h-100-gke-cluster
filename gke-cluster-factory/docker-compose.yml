services:
  factory:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    volumes:
      - ./requests:/app/requests
      - ./config:/app/config:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
