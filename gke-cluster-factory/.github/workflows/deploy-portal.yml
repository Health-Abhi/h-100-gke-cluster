name: Deploy self-service portal
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "config/**"
      - "Dockerfile"
      - "requirements.txt"
      - "terraform/factory-app/**"
      - ".github/workflows/deploy-portal.yml"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-gke-factory-portal
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: platform-production
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: Build and push portal image
        env:
          PROJECT_ID: ${{ vars.PLATFORM_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/portal:${GITHUB_SHA}"
          docker build --pull -t "$image" .
          docker push "$image"
          echo "PORTAL_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Deploy with Terraform
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          terraform -chdir=terraform/factory-app init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=platform/factory-app"
          terraform -chdir=terraform/factory-app apply -auto-approve -input=false \
            -var="project_id=${{ vars.PLATFORM_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION }}" \
            -var="container_image=${PORTAL_IMAGE}" \
            -var="github_owner=${{ github.repository_owner }}" \
            -var="github_repository=${{ github.event.repository.name }}" \
            -var="invoker_group=${{ vars.PORTAL_INVOKER_GROUP }}" \
            -var="iam_principal_type=${{ vars.IAM_PRINCIPAL_TYPE != '' && vars.IAM_PRINCIPAL_TYPE || 'group' }}"
          terraform -chdir=terraform/factory-app output -raw portal_url >> "$GITHUB_STEP_SUMMARY"
